name = "ref-cloudflare-d1-app"
main = "src/index.ts"
compatibility_date = "2026-07-25"

[[d1_databases]]
binding = "DB"
database_name = "vcqa-ref-d1-local"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

[env.preview]
name = "ref-cloudflare-d1-app-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "vcqa-ref-d1-preview"
database_id = "preview-placeholder"
migrations_dir = "migrations"

[env.production]
name = "ref-cloudflare-d1-app"

[[env.production.d1_databases]]
binding = "DB"
database_name = "vcqa-ref-d1-production"
database_id = "production-placeholder"
migrations_dir = "migrations"

